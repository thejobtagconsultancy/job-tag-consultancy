<style>
/* Calm, low-glare theme built around The Job Tag logo red. Warm greys instead of pure white or black, soft text, one accent colour used sparingly. Light and dark themes, plus Auto (follows the computer). */
:root{
  --bg:#F3F0EA; --surface:#FBFAF7; --surface-2:#F1EEE8; --ink:#2C2B2F; --muted:#6A665F; --line:#DDD8CE;
  --accent:#C9293F; --accent-ink:#FFFFFF; --accent-text:#B3203A; --accent-soft:#F6E3E4;
  --danger:#B3342F; --danger-soft:#F7E6E3;
  --font-ui:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17161A; --surface:#201F24; --surface-2:#27262C; --ink:#E7E4DF; --muted:#A5A19A; --line:#37353C;
    --accent:#C93A4E; --accent-ink:#FFFFFF; --accent-text:#FF8A98; --accent-soft:#3A2327;
    --danger:#FF8F86; --danger-soft:#3A2322; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17161A; --surface:#201F24; --surface-2:#27262C; --ink:#E7E4DF; --muted:#A5A19A; --line:#37353C;
  --accent:#C93A4E; --accent-ink:#FFFFFF; --accent-text:#FF8A98; --accent-soft:#3A2327;
  --danger:#FF8F86; --danger-soft:#3A2322; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1060px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.45rem;line-height:1.15;margin:0;letter-spacing:-.005em;text-wrap:balance;font-weight:700}
h2{font-size:1.05rem;margin:0}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
a{color:var(--accent-text)}

/* logos: the black-text version on light, the white-text version on dark */
.logo img.lg-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo img.lg-light{display:none}:root:not([data-theme="light"]) .logo img.lg-dark{display:block}}
:root[data-theme="dark"] .logo img.lg-light{display:none}
:root[data-theme="dark"] .logo img.lg-dark{display:block}
.logo img{height:52px;width:auto;display:block}

.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;min-width:0}
.brand .txt{min-width:0}
.sub{color:var(--muted);margin-top:2px;font-size:.92rem;overflow-wrap:anywhere}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.5rem .95rem;font-weight:600;cursor:pointer;min-height:42px;font-size:.95rem}
.btn:hover{border-color:var(--accent-text)}
.btn:disabled{opacity:.5;cursor:default}
.btn.sm{min-height:34px;padding:.25rem .7rem;font-size:.85rem}
.btn.link{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.solid{background:var(--danger);color:var(--surface);border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}

.banner{background:var(--danger-soft);border:1px solid var(--danger);border-radius:var(--radius);padding:.7rem .9rem}

.strip{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center}
.total{display:flex;align-items:baseline;gap:10px}
.total b{font-size:2rem;line-height:1;font-variant-numeric:tabular-nums;font-weight:700}
.total span{color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0;flex:1 1 320px;align-items:center}
.fchip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:.28rem .8rem;font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;gap:.45rem;align-items:center}
.fchip i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
.fchip:hover{border-color:var(--accent-text)}
.fchip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fchip[aria-pressed="true"] i{color:var(--accent-ink);opacity:.85}

input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.55rem .7rem;min-height:42px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
textarea{resize:vertical}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
@media (max-width:900px){.fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ff{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-weight:600;font-size:.82rem;color:var(--muted)}
.rng{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.frow{display:flex;justify-content:flex-end}
.count{color:var(--muted);font-size:.9rem;margin-top:-6px}

.list{display:flex;flex-direction:column;gap:8px}
.rec{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,.9fr) minmax(0,1fr);gap:6px 18px;align-items:center;padding:.85rem 1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
.rec:hover{border-color:var(--accent-text)}
.rec .who{min-width:0}
.rec .nm{background:none;border:0;padding:0;font-weight:700;font-size:1.02rem;cursor:pointer;text-align:left;max-width:100%;overflow-wrap:anywhere}
.rec .no{font-family:var(--font-mono);font-size:.8rem;color:var(--muted);margin-right:8px}
.rec .line{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.rec .ph{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
.rec .facts{font-size:.92rem;display:flex;flex-direction:column;gap:2px;min-width:0}
.rec .facts span{color:var(--muted)}
.rec .facts b{font-variant-numeric:tabular-nums;font-weight:600}
.rec .sk{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tag{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:0 .45rem;font-size:.82rem;color:var(--ink)}
.iv{display:flex;flex-direction:column;gap:4px;align-items:flex-start;min-width:0}
.pill{--h:#7b8794;font-weight:600;font-size:.8rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--h) 35%,var(--surface));background:color-mix(in srgb,var(--h) 14%,var(--surface));color:color-mix(in srgb,var(--h) 60%,var(--ink));padding:.1rem .6rem}
.pill.none{font-weight:500}
.stsel{--h:#7b8794;font-weight:600;font-size:.88rem;border-radius:999px;border:1px solid color-mix(in srgb,var(--h) 35%,var(--surface));background:color-mix(in srgb,var(--h) 14%,var(--surface));color:color-mix(in srgb,var(--h) 60%,var(--ink));padding:.3rem .6rem;min-height:34px;width:auto}
.st-lead{--h:#6F87B0}.st-apply{--h:#B98A2E}.st-selected{--h:#4E9B6C}.st-rejected{--h:#C25A5A}
.rs-pending{--h:#B98A2E}.rs-selected{--h:#4E9B6C}.rs-rejected{--h:#C25A5A}.rs-on-hold{--h:#6F87B0}.rs-did-not-attend{--h:#8A8780}
@media (max-width:760px){.rec{grid-template-columns:minmax(0,1fr)}}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:36px 20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{color:var(--muted);max-width:52ch}
.empty h2{font-size:1.15rem}

.overlay{position:fixed;inset:0;background:rgba(12,10,12,.55);overflow:auto;padding-block:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-bottom));padding-inline:16px;display:flex;z-index:10}
.panel{background:var(--surface);color:var(--ink);width:min(820px,100%);margin:auto;border-radius:14px;border:1px solid var(--line);position:relative}
.ph-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:18px 22px 6px}
.ph-body{padding:6px 22px 20px;display:flex;flex-direction:column;gap:22px}
.ph-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:12px 22px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;border-radius:0 0 14px 14px}
.ph-foot .msg{margin-right:auto;color:var(--danger);font-size:.92rem;min-width:0;flex:1 1 220px}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0 0 6px;margin-bottom:10px;width:100%;border-bottom:1px solid var(--line);font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-text)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1/-1}
label{font-weight:600;font-size:.9rem}
.hint{color:var(--muted);font-size:.82rem}
.autono{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:.55rem .7rem;min-height:42px;font-family:var(--font-mono);color:var(--muted)}
@media (max-width:620px){.grid{grid-template-columns:1fr}}

.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:.2rem .3rem .2rem .75rem;background:var(--surface-2)}
.opt label{font-weight:500;font-size:.92rem;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.opt input{width:auto;min-height:0;margin:0;accent-color:var(--accent)}
.opt .x{border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:50%;width:24px;height:24px;line-height:1;padding:0}
.opt .x:hover{color:var(--danger)}
.addopt{display:flex;gap:8px;margin-top:6px}
.addopt input{flex:1;min-width:0}

.rowcard{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.rc-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rc-head b{font-size:.9rem}
.addrow{margin-top:2px}
.subgrid{display:flex;flex-direction:column;gap:12px;margin-top:12px}

.dl{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:8px 14px;margin:0}
.dl dt{color:var(--muted);font-size:.9rem}
.dl dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
@media (max-width:520px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}
.mono{font-family:var(--font-mono)}
.vcard{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;margin-top:8px}
.vcard h3{margin:0 0 6px;font-size:.92rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:.6rem 1rem;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.overlay{animation:fade .12s ease-out}@keyframes fade{from{opacity:0}to{opacity:1}}}

.gate{min-height:75vh;display:flex;align-items:center;justify-content:center}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:30px 26px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.gate-card .logo img{height:96px}
.gate-card .sub{font-size:1rem}
.gate-msg{color:var(--danger);min-height:1.4em;overflow-wrap:anywhere}

.skillrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.skillrow input{flex:1;min-width:0}

</style>
</head>

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function slug(s){return String(s).toLowerCase().replace(/\s+/g,"-")}
  function digits(s){return String(s||"").replace(/\D/g,"")}
  function isAdmin(){return me.role==="admin"}
  function has(v){return v!==undefined&&v!==null&&String(v).trim()!==""}
  function money(v){var n=Number(String(v).replace(/,/g,""));return isNaN(n)||v===""?esc(v):"₹"+n.toLocaleString("en-IN")}
  function fmtDate(s){try{var d=new Date(String(s).replace(" ","T"));return isNaN(d)?"":d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}catch(e){return ""}}
  function fmtDay(ymd){if(!ymd)return "";var p=String(ymd).split("-");if(p.length!==3||isNaN(+p[0]))return ymd;return fmtDate(new Date(+p[0],+p[1]-1,+p[2]).toISOString())}
  function applyOf(c){return Array.isArray(c.apply)?c.apply:[]}
  function skillsOf(c){return Array.isArray(c.skills)?c.skills:(has(c.skills)?[String(c.skills)]:[])}
  function listOf(c,k){return k==="apply"?applyOf(c):k==="skills"?skillsOf(c):null}
  function stOf(c){return c.status||"Lead"}
  function num(x){var n=parseFloat(String(x==null?"":x).replace(/,/g,""));return isNaN(n)?null:n}
  function inRange(val,min,max){
    var lo=num(min),hi=num(max);
    if(lo===null&&hi===null)return true;
    var n=num(val);if(n===null)return false;
    if(lo!==null&&n<lo)return false;
    if(hi!==null&&n>hi)return false;
    return true;
  }
  function workOf(c){var out=[];for(var n=1;n<=MAXW;n++){var e={};var any=false;WF.forEach(function(p){e[p]=c["w"+n+p]||"";if(has(e[p]))any=true});if(any)out.push(e)}return out}
  function intsOf(c){var out=[];for(var n=1;n<=MAXI;n++){var e={};var any=false;IF.forEach(function(p){e[p]=c["int"+n+p]||"";if(has(e[p]))any=true});if(any)out.push(e)}return out}
  function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3600)}
  function showBanner(m){var b=$("#banner");if(m){b.textContent=m;b.hidden=false}else{b.hidden=true}}
  function allOptions(){
    var seen={},out=[];
    opts.concat.apply(opts,all.map(applyOf)).forEach(function(o){if(o&&!seen[o]){seen[o]=1;out.push(o)}});
    return out;
  }

  /* ---------- theme: Auto, Light, Dark (remembered on this computer) ---------- */
  var THEMES=["auto","light","dark"];
  function getTheme(){try{var t=localStorage.getItem("jt_theme");return THEMES.indexOf(t)>=0?t:"auto"}catch(e){return "auto"}}
  function setTheme(t){
    try{localStorage.setItem("jt_theme",t)}catch(e){}
    if(t==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",t);
    var b=$("#btn-theme");if(b)b.textContent="Theme: "+t.charAt(0).toUpperCase()+t.slice(1);
  }

  /* ---------- sign-in ---------- */
  function jwtExp(t){try{var p=JSON.parse(atob(t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));return p.exp*1000}catch(e){return 0}}
  function getStored(){try{var t=sessionStorage.getItem("jt_token");return t&&jwtExp(t)>Date.now()+60000?t:""}catch(e){return ""}}
  function store(t){try{sessionStorage.setItem("jt_token",t)}catch(e){}}
  function clearStored(){try{sessionStorage.removeItem("jt_token")}catch(e){}}
  function gateMsg(m){$("#gate-msg").textContent=m||""}
  function showGate(msg){
    token="";clearStored();
    $("#app").hidden=true;$("#gate").hidden=false;gateMsg(msg);
    closeOvQuiet();
    try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.disableAutoSelect()}catch(e){}
  }
  function showApp(){$("#gate").hidden=true;$("#app").hidden=false}
  function signOut(){loaded=false;all=[];opts=[];showGate("")}

  function onCredential(resp){
    token=resp&&resp.credential||"";
    if(!token)return;
    store(token);enter();
  }
  async function enter(){
    gateMsg("Checking your access...");
    await load(true);
  }
  function initGoogle(tries){
    if(window.google&&google.accounts&&google.accounts.id){
      google.accounts.id.initialize({client_id:CLIENT_ID,callback:onCredential,auto_select:true,cancel_on_tap_outside:false});
      google.accounts.id.renderButton($("#g-btn"),{theme:"outline",size:"large",text:"signin_with",shape:"rectangular"});
      return;
    }
    if(tries>40){gateMsg("Google sign-in could not load. Check your internet connection and reload the page.");return}
    setTimeout(function(){initGoogle(tries+1)},250);
  }

  /* ---------- server calls ---------- */
  async function api(action,payload){
    var body=Object.assign({action:action,idToken:token},payload||{});
    var res;
    try{res=await fetch(API_URL,{method:"POST",body:JSON.stringify(body),redirect:"follow"})}
    catch(e){throw {code:"network",message:"Could not reach the server. Check your internet connection."}}
    var data;
    try{data=await res.json()}catch(e){throw {code:"server",message:"The server sent an unexpected reply. Try again in a moment."}}
    if(data&&data.error)throw {code:data.error,message:data.message||"Something went wrong.",email:data.email};
    return data;
  }
  function failText(e){
    if(e&&e.code==="auth"){showGate(e.message||"Your sign-in expired. Please sign in again.");return ""}
    if(e&&e.code==="not_allowed"){showGate((e.email?e.email+" is":"This email is")+" not on the allowed list.");return ""}
    if(e&&e.code==="forbidden")return "Only an admin can do this.";
    return (e&&e.message)||"Something went wrong. Try again.";
  }

  function normalize(c){
    c.apply=Array.isArray(c.apply)?c.apply:[];
    c.skills=skillsOf(c);
    c.id=String(c.no);
    return c;
  }
  async function load(first){
    $("#btn-reload").disabled=true;
    try{
      var d=await api("list");
      me={email:d.email,role:d.role};
      all=(d.candidates||[]).map(normalize);
      opts=d.options||[];
      loaded=true;showBanner("");
      $("#me").textContent="Signed in as "+me.email+" ("+(isAdmin()?"admin":"team member")+")";
      $("#btn-export").hidden=!isAdmin();
      showApp();render();if(formOpen)renderApplyBox([]);
    }catch(e){
      var t=failText(e);
      if(t){
        if(first||!loaded){showGate(t)}else{showBanner(t)}
      }
    }
    $("#btn-reload").disabled=false;
  }

  /* ---------- list ---------- */
  function visible(){
    var q=$("#q").value.trim().toLowerCase(), g=$("#flt-gender").value, ap=$("#flt-apply").value, city=$("#flt-city").value,
        pref=$("#flt-pref").value, res=$("#flt-result").value, sort=$("#flt-sort").value,
        ty=$("#flt-type").value, jn=$("#flt-joining").value, src=$("#flt-source").value;
    var rows=all.filter(function(c){
      if(statusFilter&&stOf(c)!==statusFilter)return false;
      if(g&&c.gender!==g)return false;
      if(ap&&applyOf(c).indexOf(ap)<0)return false;
      if(city&&c.city!==city)return false;
      if(pref&&c.prefCity!==pref)return false;
      if(ty&&c.type!==ty)return false;
      if(jn&&c.joining!==jn)return false;
      if(src&&c.source!==src)return false;
      if(res&&!intsOf(c).some(function(i){return i.Result===res}))return false;
      if(!inRange(c.curSalary,$("#flt-cur-min").value,$("#flt-cur-max").value))return false;
      if(!inRange(c.expSalary,$("#flt-exp-min").value,$("#flt-exp-max").value))return false;
      if(q){
        var hay=CSV_KEYS.map(function(k){var l=listOf(c,k);return l?l.join(" "):(c[k]||"")}).join(" ").toLowerCase();
        var phoneHit=/^[\d\s+\-]+$/.test(q)&&digits(q)&&digits(c.phone).indexOf(digits(q))>=0;
        if(hay.indexOf(q)<0&&!phoneHit)return false;
      }
      return true;
    });
    rows.sort(function(a,b){
      if(sort==="name")return String(a.name||"").localeCompare(String(b.name||""));
      if(sort==="exp")return (parseFloat(b.exp)||0)-(parseFloat(a.exp)||0);
      if(sort==="no")return (Number(a.no)||0)-(Number(b.no)||0);
      var x=String(a.createdAt||""),y=String(b.createdAt||"");
      return sort==="old"?x.localeCompare(y):y.localeCompare(x);
    });
    return rows;
  }

  function fillSelect(sel,first,values){
    var cur=sel.value;
    sel.innerHTML='<option value="">'+first+'</option>'+values.map(function(v){return '<option>'+esc(v)+'</option>'}).join("");
    if(values.indexOf(cur)>=0)sel.value=cur;
  }

  function ivPill(c){
    var list=intsOf(c);
    if(!list.length)return '<span class="pill none">No interview yet</span>';
    var last=list[list.length-1],r=last.Result;
    return '<span class="pill rs-'+slug(r||"pending")+'">Interview '+list.length+': '+esc(r||"Pending")+(last.Date?' · '+esc(fmtDay(last.Date)):"")+'</span>';
  }

  function render(){
    $("#total").textContent=all.length;
    var counts={};STATUSES.forEach(function(s){counts[s]=0});
    all.forEach(function(c){var s=stOf(c);counts[s]=(counts[s]||0)+1});
    $("#chips").innerHTML='<button type="button" class="fchip" data-st="" aria-pressed="'+(statusFilter===""?"true":"false")+'">All <i>'+all.length+'</i></button>'+
      STATUSES.map(function(s){return '<button type="button" class="fchip" data-st="'+esc(s)+'" aria-pressed="'+(statusFilter===s?"true":"false")+'">'+esc(s)+' <i>'+counts[s]+'</i></button>'}).join("");

    function uniq(k){return Array.from(new Set(all.map(function(c){return c[k]}).filter(Boolean))).sort()}
    fillSelect($("#flt-gender"),"All genders",GENDERS);
    fillSelect($("#flt-apply"),"All job options",allOptions());
    fillSelect($("#flt-city"),"All locations",uniq("city"));
    fillSelect($("#flt-pref"),"All locations",uniq("prefCity"));
    fillSelect($("#flt-type"),"Fresher and Experience",TYPES);
    fillSelect($("#flt-joining"),"Any availability",JOINING);
    fillSelect($("#flt-source"),"All sources",SOURCES);
    fillSelect($("#flt-result"),"Any result",RESULTS);

    var rows=visible(), list=$("#list");
    $("#count").textContent=loaded&&all.length?("Showing "+rows.length+" of "+all.length+" candidates"):"";

    if(!loaded){
      list.innerHTML='<div class="empty"><h2>Loading your candidates</h2><p>This takes a few seconds.</p></div>';
    }else if(!all.length){
      list.innerHTML='<div class="empty"><h2>No candidates yet</h2><p>Add each candidate with their details, work experience, skills and interviews.</p><button class="btn primary" type="button" data-act="add">Add the first candidate</button></div>';
    }else if(!rows.length){
      list.innerHTML='<div class="empty"><h2>No candidate matches</h2><p>Try a different search word or clear the filters.</p><button class="btn" type="button" data-act="clear">Clear search and filters</button></div>';
    }else{
      list.innerHTML=rows.map(function(c){
        var locs=[c.city,c.prefCity&&("wants "+c.prefCity)].filter(Boolean).join(" · ");
        var expText=c.type==="Fresher"?"Fresher":(has(c.exp)?esc(c.exp)+" yr":"–");
        return '<article class="rec" data-id="'+esc(c.id)+'">'+
          '<div class="who"><span class="no">#'+esc(c.no)+'</span><button class="nm" type="button" data-act="view">'+esc(c.name||"Unnamed")+'</button>'+
            (c.phone?'<div class="ph">'+esc(c.phone)+'</div>':'')+
            '<div class="line">'+esc(locs||"No location added")+'</div></div>'+
          '<div class="sk">'+(applyOf(c).length?applyOf(c).map(function(s){return '<span class="tag">'+esc(s)+'</span>'}).join(""):'<span class="line">No role selected</span>')+'</div>'+
          '<div class="facts">'+
            '<div><span>Experience </span><b>'+expText+'</b></div>'+
            '<div><span>Expects </span><b>'+(c.expSalary?money(c.expSalary)+"/mo":"–")+'</b></div></div>'+
          '<div class="iv"><select class="stsel st-'+slug(stOf(c))+'" data-act="status" aria-label="Status of '+esc(c.name||"candidate")+'">'+
            STATUSES.map(function(s){return '<option'+(s===stOf(c)?" selected":"")+'>'+esc(s)+'</option>'}).join("")+'</select>'+
            ivPill(c)+'</div>'+
        '</article>';
      }).join("");
    }
    $("#btn-export").disabled=!rows.length;
  }

  /* ---------- overlay ---------- */
  function openOv(html,lock,isForm){
    lastFocus=document.activeElement;modalLocked=!!lock;formOpen=!!isForm;
    var ov=$("#ov");ov.innerHTML=html;ov.hidden=false;ov.scrollTop=0;
  }
  function closeOvQuiet(){var ov=$("#ov");ov.hidden=true;ov.innerHTML="";editId=null;dupWarned=false;formOpen=false}
  function closeOv(){
    closeOvQuiet();
    if(lastFocus&&lastFocus.focus)try{lastFocus.focus()}catch(e){}
  }

  /* ---------- form ---------- */
  function ctl(f,id,val){
    if(f.type==="select"){
      if(f.noBlank&&!val)val=f.options[0];
      return '<select id="'+id+'">'+(f.noBlank?"":'<option value="">Select</option>')+f.options.map(function(o){return '<option'+(o===val?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select>';
    }
    if(f.type==="textarea")return '<textarea id="'+id+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||"")+'">'+esc(val)+'</textarea>';
    return '<input id="'+id+'" type="'+(f.type||"text")+'"'+(f.mode?' inputmode="'+f.mode+'"':"")+' value="'+esc(val)+'" placeholder="'+esc(f.ph||"")+'" autocomplete="off">';
  }
  function fieldHTML(k,val){
    var f=F[k],id="f-"+k;
    if(k==="no")return '<div class="fld"><label>'+esc(f.label)+'</label><div class="autono">'+(val?esc(val):"Assigned automatically")+'</div></div>';
    return '<div class="fld'+(f.wide?" wide":"")+'"><label for="'+id+'">'+esc(f.label)+(f.req?" *":"")+'</label>'+ctl(f,id,val)+'</div>';
  }
  function grid(keys,v){return '<div class="grid">'+keys.map(function(k){return fieldHTML(k,v[k]==null?"":v[k])}).join("")+'</div>'}

      WF.map(function(p){return '<div class="fld"><label>'+WLABEL[p]+'</label><input type="'+"text"+'" data-p="'+p+'"'+(p==="Salary"?' inputmode="numeric"':"")+' value="'+esc(e[p]||"")+'" placeholder="'+(p==="Year"?"e.g. 2021 - 2023":"")+'" autocomplete="off"></div>'}).join("")+
      '</div></div>';

  function ivRowHTML(e){

      '<div class="fld"><label>'+ILABEL.Result+'</label><select data-p="Result"><option value="">Select</option>'+RESULTS.map(function(o){return '<option'+(o===e.Result?" selected":"")+'>'+esc(o)+'</option>'}).join("")+'</select></div>'+
      '<div class="fld wide"><label>'+ILABEL.Notes+'</label><textarea rows="3" data-p="Notes" placeholder="Who interviewed, what was discussed, feedback">'+esc(e.Notes||"")+'</textarea></div>'+
      '</div></div>';

  function skillRowHTML(v){

  function renumber(){
    ["work","iv","skill"].forEach(function(kind){
      var rows=$$('[data-row="'+kind+'"]'),max=kind==="work"?MAXW:kind==="iv"?MAXI:Infinity;
      rows.forEach(function(r,i){

  function toggleExp(){

    if(!box.hidden&&!$$('[data-row="work"]').length){$("#worklist").insertAdjacentHTML("beforeend",workRowHTML());renumber()}

  function renderApplyBox(extraSelected){
    var box=$("#applybox");if(!box)return;
    var sel=$$("input[data-opt]:checked",box).map(function(i){return i.getAttribute("data-opt")});
    (extraSelected||[]).forEach(function(s){if(sel.indexOf(s)<0)sel.push(s)});
    var list=opts.slice();sel.forEach(function(s){if(list.indexOf(s)<0)list.push(s)});
    box.innerHTML=list.length?list.map(function(o){
      var inList=opts.indexOf(o)>=0;
      return '<span class="opt"><label><input type="checkbox" data-opt="'+esc(o)+'"'+(sel.indexOf(o)>=0?" checked":"")+'> '+esc(o)+'</label>'+

    }).join(""):'<span class="hint">No options yet. Type one below and press Add option.</span>';

  /* ---------- view ---------- */
  function dl(items){return '<dl class="dl">'+items.map(function(i){return '<dt>'+esc(i[0])+'</dt><dd>'+i[1]+'</dd>'}).join("")+'</dl>'}
  function openView(id){
    var c=all.filter(function(x){return x.id===id})[0];if(!c)return;
    var s="";
    function sec(title,inner){if(inner)s+='<fieldset><legend>'+esc(title)+'</legend>'+inner+'</fieldset>'}
    function rowsOf(pairs){var out=pairs.filter(function(p){return has(p[2])});return out.length?dl(out.map(function(p){return [p[0],p[1]]})):""}
    var d=digits(c.phone),wa=d.length===10?"91"+d:(d.length===12&&d.indexOf("91")===0?d:"");
    sec("Basic Details",rowsOf([
      ["Mobile Number",'<span class="mono">'+esc(c.phone)+'</span>',c.phone],
      ["Email",c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':"",c.email],
      ["Gender",esc(c.gender),c.gender],["DOB",esc(fmtDay(c.dob)),c.dob],
      ["Current Location",esc(c.city),c.city],["Preferred Location",esc(c.prefCity),c.prefCity]]));
    sec("Education",rowsOf([["Highest Qualification",esc(c.education),c.education]]));
    sec("Job Preference",rowsOf([
      ["Want to Apply",applyOf(c).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join(" "),applyOf(c).length?"x":""],
      ["Current Salary",money(c.curSalary)+" per month",c.curSalary],["Expected Salary",money(c.expSalary)+" per month",c.expSalary],
      ["Joining Availability",esc(c.joining),c.joining]]));
    var wk=workOf(c);
    sec("Work Experience",rowsOf([["Type",esc(c.type),c.type],["Total Experience",esc(c.exp)+" years",c.exp]])+
      wk.map(function(e,i){return '<div class="vcard"><h3>Company '+(i+1)+'</h3>'+dl([["Company Name",esc(e.Company)],["Designation",esc(e.Role)],["Salary",e.Salary?money(e.Salary)+" per month":""],["Year",esc(e.Year)]].filter(function(r){return r[1]}))+'</div>'}).join(""));
    sec("Skills",rowsOf([["Skills",skillsOf(c).map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join(" "),skillsOf(c).length?"x":""]]));
    sec("Source of Candidate",rowsOf([["Source",esc(c.source),c.source]]));
    var iv=intsOf(c);
    sec("Interview Details",iv.map(function(e,i){return '<div class="vcard"><h3>Interview '+(i+1)+'</h3>'+dl([["Date",esc(fmtDay(e.Date))],["Result",esc(e.Result)],["Notes",esc(e.Notes)]].filter(function(r){return r[1]}))+'</div>'}).join(""));
    sec("Remarks",rowsOf([["Remarks",esc(c.remarks),c.remarks]]));
    openOv('<div class="panel" role="dialog" aria-modal="true" aria-label="Candidate details">'+
      '<div class="ph-head"><div><h2 style="font-size:1.3rem">'+esc(c.name||"Unnamed")+'</h2><p class="sub">'+(c.no?'No. '+esc(c.no)+' · ':'')+'Status: '+esc(stOf(c))+(c.createdAt?' · Added '+esc(fmtDate(c.createdAt)):'')+'</p></div><button class="btn ghost" type="button" data-act="close" aria-label="Close">Close</button></div>'+
      '<div class="ph-body">'+s+'</div>'+
      '<div class="ph-foot" data-id="'+esc(c.id)+'">'+(wa?'<a class="btn link" href="https://wa.me/'+wa+'" target="_blank" rel="noopener">Open WhatsApp</a>':"")+
      '<button class="btn" type="button" data-act="pdf" title="Profile without phone number and email, with a watermark">Download PDF</button>'+
      '<span style="flex:1"></span>'+(isAdmin()?'<span id="delzone"><button class="btn danger" type="button" data-act="del">Delete</button></span>':'')+'<button class="btn primary" type="button" data-act="edit">Edit</button></div></div>',false,false);
  }

  /* ---------- PDF profile (no phone number, no email, watermarked) ---------- */
  function profileHTML(c){
    var logo=$(".lg-light").src;
    function row(l,v){return has(v)?'<tr><th>'+esc(l)+'</th><td>'+v+'</td></tr>':""}
    function block(t,inner){return inner?'<h2>'+esc(t)+'</h2>'+inner:""}
    function tbl(rows){var h=rows.join("");return h?'<table>'+h+'</table>':""}
    var wk=workOf(c);
    var work=wk.map(function(e,i){return '<div class="co"><b>'+esc(e.Company||("Company "+(i+1)))+'</b>'+(e.Role?' — '+esc(e.Role):"")+
      '<div class="muted">'+[e.Year?esc(e.Year):"",e.Salary?"Salary "+money(e.Salary)+" per month":""].filter(Boolean).join(" · ")+'</div></div>'}).join("");
    var age="";
    var body=
      block("Basic Details",tbl([row("Gender",esc(c.gender)),row("Date of Birth",esc(fmtDay(c.dob))),row("Current Location",esc(c.city)),row("Preferred Location",esc(c.prefCity))]))+
      block("Education",tbl([row("Highest Qualification",esc(c.education))]))+
      block("Job Preference",tbl([row("Applying For",applyOf(c).map(esc).join(", ")),row("Current Salary",has(c.curSalary)?money(c.curSalary)+" per month":""),row("Expected Salary",has(c.expSalary)?money(c.expSalary)+" per month":""),row("Joining Availability",esc(c.joining))]))+
      block("Work Experience",tbl([row("Experience Level",esc(c.type)),row("Total Experience",has(c.exp)?esc(c.exp)+" years":"")])+work)+
      block("Skills",tbl([row("Skills",skillsOf(c).map(esc).join(", "))]));
    return '<!doctype html><html><head><meta charset="utf-8"><title>Candidate Profile - '+esc(c.name||"")+' - The Job Tag Consultancy</title><style>'+
      '@page{size:A4;margin:16mm 14mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}'+
      'body{font-family:Arial,Helvetica,sans-serif;color:#26242a;font-size:12.5px;line-height:1.5;margin:0}'+
      '.wm{position:fixed;left:50%;top:50%;width:62%;transform:translate(-50%,-50%) rotate(-24deg);opacity:.075;z-index:0}'+
      '.top{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #D92B43;padding-bottom:10px;margin-bottom:14px;position:relative;z-index:1}'+
      '.top img{height:62px}.top .t{text-align:right}.top .t b{display:block;font-size:17px;letter-spacing:.02em}.top .t span{color:#6a665f}'+
      '.name{font-size:22px;font-weight:700;margin:0 0 2px;position:relative;z-index:1}.sub{color:#6a665f;margin-bottom:6px;position:relative;z-index:1}'+
      'h2{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#B3203A;border-bottom:1px solid #e3ded5;padding-bottom:3px;margin:16px 0 6px;position:relative;z-index:1}'+
      'table{width:100%;border-collapse:collapse;position:relative;z-index:1}th{width:34%;text-align:left;color:#6a665f;font-weight:600;padding:3px 8px 3px 0;vertical-align:top}td{padding:3px 0}'+
      '.co{padding:5px 0;border-bottom:1px dashed #e3ded5;position:relative;z-index:1}.muted{color:#6a665f}'+
      '.foot{margin-top:22px;padding-top:8px;border-top:1px solid #e3ded5;color:#6a665f;font-size:11px;position:relative;z-index:1}'+
      '</style></head><body>'+
      '<img class="wm" src="'+logo+'" alt="">'+
      '<div class="top"><img src="'+logo+'" alt="The Job Tag Consultancy"><div class="t"><b>CANDIDATE PROFILE</b><span>Ref. No. '+esc(c.no)+'</span></div></div>'+
      '<p class="name">'+esc(c.name||"Candidate")+'</p>'+
      body+
      '<div class="foot">Contact details are shared by The Job Tag Consultancy on request.</div>'+
      '</body></html>';
  }
  function downloadPDF(id){
    var c=all.filter(function(x){return x.id===id})[0];if(!c)return;
    var old=document.getElementById("pdfframe");if(old)old.remove();
    var fr=document.createElement("iframe");fr.id="pdfframe";
    fr.setAttribute("aria-hidden","true");
    fr.style.cssText="position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
    document.body.appendChild(fr);
    var doc=fr.contentWindow.document;doc.open();doc.write(profileHTML(c));doc.close();
    var imgs=Array.prototype.slice.call(doc.images),pending=imgs.filter(function(i){return !i.complete}).length;
    function go(){try{fr.contentWindow.focus();fr.contentWindow.print();toast("In the print window, choose Save as PDF as the destination.")}catch(e){toast("Could not open the print window.")}}
    if(!pending)setTimeout(go,150);
    else{var n=pending;imgs.forEach(function(i){if(!i.complete)i.onload=i.onerror=function(){if(--n===0)go()}})}
  }

  /* ---------- job options ---------- */
  async function addOption(){
    var inp=$("#newopt");if(!inp)return;
    var v=inp.value.trim().replace(/;/g,",");if(!v)return;
    if(opts.some(function(o){return o.toLowerCase()===v.toLowerCase()})){toast("That option already exists");inp.value="";return}
    try{
      var d=await api("addOption",{name:v});
      opts=d.options||opts;
      inp.value="";renderApplyBox([v]);render();
    }catch(e){var t=failText(e);if(t)toast(t)}
  }
  async function removeOption(o){
    try{
      var d=await api("removeOption",{name:o});
      opts=d.options||opts.filter(function(x){return x!==o});
      renderApplyBox([]);render();
    }catch(e){var t=failText(e);if(t)toast(t)}
  }

  /* ---------- save, status, delete ---------- */
  var STATIC_KEYS=["status","name","phone","email","gender","dob","city","prefCity","education","curSalary","expSalary","joining","type","exp","source","remarks"];
  function gather(){
    var rec={};
    STATIC_KEYS.forEach(function(k){var el=$("#f-"+k);rec[k]=el?el.value.trim():""});
    rec.apply=$$("#applybox input[data-opt]:checked").map(function(i){return i.getAttribute("data-opt")});
    rec.skills=$$('[data-row="skill"] [data-p="Skill"]').map(function(i){return i.value.trim()}).filter(Boolean);
    if(rec.type!=="Experience"){rec.exp=""}
    $$('[data-row="work"]').forEach(function(r,i){
      if(rec.type!=="Experience")return;
      WF.forEach(function(p){rec["w"+(i+1)+p]=r.querySelector('[data-p="'+p+'"]').value.trim()});
    });
    $$('[data-row="iv"]').forEach(function(r,i){
      IF.forEach(function(p){rec["int"+(i+1)+p]=r.querySelector('[data-p="'+p+'"]').value.trim()});
    });
    return rec;
  }
  function setSaving(on){var b=$("#btn-save");if(!b)return;b.disabled=on;b.textContent=on?"Saving...":(editId?"Save changes":"Save candidate")}

  async function saveForm(){
    if(busy)return;
    var msg=$("#fmsg"),rec=gather();msg.textContent="";
    if(!rec.name){msg.textContent="Enter the candidate's full name.";$("#f-name").focus();return}
    if(!rec.phone){msg.textContent="Enter a mobile number so you can reach the candidate.";$("#f-phone").focus();return}
    if(rec.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rec.email)){msg.textContent="The email address does not look right.";$("#f-email").focus();return}
    var d=digits(rec.phone).slice(-10);
    var dup=all.filter(function(c){return c.id!==editId&&digits(c.phone).slice(-10)===d})[0];
    if(dup&&!dupWarned){dupWarned=true;msg.textContent=dup.name+" already has this mobile number. Press Save again to add it anyway.";return}
    var old=editId?all.filter(function(x){return x.id===editId})[0]:null;
    if(old)rec.no=old.no;
    busy=true;setSaving(true);
    try{
      var res=await api("save",{mode:old?"update":"create",rec:rec});
      busy=false;
      toast(old?"Changes saved":"Candidate added (No. "+res.no+")");
      closeOv();await load();
    }catch(e){
      busy=false;
      var t=failText(e);
      if(t){setSaving(false);msg.textContent=t+" Press Reload on the page and check the list before saving again."}
    }
  }
  async function changeStatus(id,val){
    var c=all.filter(function(x){return x.id===id})[0];if(!c)return;
    try{
      await api("status",{no:c.no,status:val});
      c.status=val;render();toast("Status set to "+val);
    }catch(e){var t=failText(e);if(t)toast(t);render()}
  }
  async function removeCandidate(id){
    var c=all.filter(function(x){return x.id===id})[0];if(!c)return;
    try{
      await api("delete",{no:c.no});
      closeOv();toast("Candidate deleted");await load();
    }catch(e){var t=failText(e);if(t)toast(t)}
  }

  /* ---------- export (admins) ---------- */
  function csvCell(v){var s=String(v==null?"":v);return /[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
  function exportCSV(){
    if(!isAdmin())return;
    var rows=visible();if(!rows.length){toast("No candidates to export");return}
    var head=CSV_KEYS.map(function(k){return csvCell(F[k]?F[k].label:k)}).concat(["Date added"]).join(",");
    head=head.replace(/^Status/,"Status");
    var lines=rows.map(function(c){
      return CSV_KEYS.map(function(k){return csvCell(listOf(c,k)?listOf(c,k).join("; "):c[k])}).concat([csvCell(c.createdAt?fmtDate(c.createdAt):"")]).join(",");
    });
    var day=new Date();var name="candidates-"+day.getFullYear()+"-"+String(day.getMonth()+1).padStart(2,"0")+"-"+String(day.getDate()).padStart(2,"0")+".csv";
    var blob=new Blob(["﻿"+head+"\r\n"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    var url=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    toast("Export downloaded");
  }

  /* ---------- events ---------- */
  F.apply={label:"Want to Apply"};
  var FILTER_IDS=["#q","#flt-gender","#flt-apply","#flt-city","#flt-pref","#flt-cur-min","#flt-cur-max","#flt-exp-min","#flt-exp-max","#flt-type","#flt-joining","#flt-source","#flt-result","#flt-sort"];
  function clearFilters(){
    statusFilter="";
    FILTER_IDS.forEach(function(s){if(s!=="#flt-sort")$(s).value=""});
    render();
  }
  $("#btn-add").addEventListener("click",function(){openForm()});
  $("#btn-export").addEventListener("click",exportCSV);
  $("#btn-reload").addEventListener("click",function(){load()});
  $("#btn-signout").addEventListener("click",signOut);
  $("#btn-clear").addEventListener("click",clearFilters);
  $("#btn-theme").addEventListener("click",function(){setTheme(THEMES[(THEMES.indexOf(getTheme())+1)%THEMES.length])});
  FILTER_IDS.forEach(function(s){$(s).addEventListener("input",render)});
  $("#chips").addEventListener("click",function(e){var b=e.target.closest("[data-st]");if(!b)return;statusFilter=b.getAttribute("data-st");render()});

  $("#list").addEventListener("click",function(e){
    var a=e.target.closest("[data-act]");
    if(a&&a.getAttribute("data-act")==="add"){openForm();return}
    if(a&&a.getAttribute("data-act")==="clear"){clearFilters();return}
    if(e.target.closest(".stsel"))return;
    var r=e.target.closest(".rec");if(r)openView(r.getAttribute("data-id"));
  });
  $("#list").addEventListener("change",function(e){
    var s=e.target.closest(".stsel");if(!s)return;
    changeStatus(s.closest(".rec").getAttribute("data-id"),s.value);
  });

  $("#ov").addEventListener("click",function(e){
    if(e.target===this&&!modalLocked){closeOv();return}
    var b=e.target.closest("[data-act]");if(!b)return;
    var act=b.getAttribute("data-act"),foot=b.closest("[data-id]"),id=foot?foot.getAttribute("data-id"):null;
    if(act==="close")closeOv();
    else if(act==="save")saveForm();
    else if(act==="addopt")addOption();
    else if(act==="rmopt")removeOption(b.getAttribute("data-opt"));
    else if(act==="add-work"){if($$('[data-row="work"]').length<MAXW){$("#worklist").insertAdjacentHTML("beforeend",workRowHTML());renumber()}}
    else if(act==="add-skill"){var sr=$("#skilllist");sr.insertAdjacentHTML("beforeend",skillRowHTML());renumber();var ins=sr.querySelectorAll("input");ins[ins.length-1].focus()}
    else if(act==="add-iv"){if($$('[data-row="iv"]').length<MAXI){$("#ivlist").insertAdjacentHTML("beforeend",ivRowHTML());renumber()}}
    else if(act==="rm-row"){var rc=b.closest("[data-row]");if(rc){rc.remove();renumber()}}
    else if(act==="pdf")downloadPDF(id);
    else if(act==="edit"){var i=id;closeOv();openForm(i)}
    else if(act==="del"){
      $("#delzone").innerHTML='<button class="btn danger solid" type="button" data-act="del-yes">Yes, delete</button> <button class="btn" type="button" data-act="del-no">Keep</button>';
    }else if(act==="del-no"){$("#delzone").innerHTML='<button class="btn danger" type="button" data-act="del">Delete</button>'}
    else if(act==="del-yes")removeCandidate(id);
  });
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("#ov").hidden)closeOv()});
  $("#ov").addEventListener("keydown",function(e){
    if(e.key==="Enter"&&e.target.matches('[data-p="Skill"]')){
      e.preventDefault();
      if(has(e.target.value)){var sr=$("#skilllist");sr.insertAdjacentHTML("beforeend",skillRowHTML());renumber();var ins=sr.querySelectorAll("input");ins[ins.length-1].focus()}
    }
  });

  /* ---------- start ---------- */
  setTheme(getTheme());
  if(CLIENT_ID.indexOf("__")===0||API_URL.indexOf("__")===0){
    gateMsg("This page is not set up yet. Add the Google Client ID and the Web app URL at the top of the script in this file.");
    return;
  }
  initGoogle(0);
  token=getStored();
  if(token)enter();
})();

</script>
</body>
</html>
